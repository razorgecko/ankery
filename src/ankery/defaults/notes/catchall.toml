# The neutral catch-all note: the guaranteed terminus for any entry no pack note
# (bespoke or the pack's own `applies_to = "*"` default) claims. It names no
# domain — Front is the bare term, Back dumps whatever the Entry carries: each
# non-empty collection as its own block in insertion order, then the properties block,
# blocks separated by <hr> and each block's items by <br>. The <br>/<hr> tags are
# our structure; every provider-supplied value is autoescaped (notedef.py) so it
# cannot inject markup into the card.
#
# A block renders only when its source is non-empty, and the <hr> separator is
# emitted only between two present blocks (the `ns.sep` flag), so there is never a
# leading, trailing, or doubled rule. The catch-all sees no pack declarations at
# render time, so it pairs no collections by index (that is a pack-note convention)
# and dumps each independently.
#
# This is an ankery-owned model: it ships a `name`, a Front/Back field set, and
# one forward card (no reverse — reversing a structured info dump makes a poor
# flashcard). It carries no css of its own, so the sink styles it with the
# fallback (the pack's style.css, else the engine default), the same styling
# bespoke cards inherit. `Config.note_type` defaults to this `name`; the user can
# repoint the catch-all at a foreign model with --note-type.
name = "Ankery Basic"

[map]
Front = "{{ term }}"
Back = """
{%- set ns = namespace(sep = false) -%}
{%- for key, items in collections.items() -%}
{%- if items -%}
{%- if ns.sep %}<hr>{% endif -%}
{%- for item in items %}{% if not loop.first %}<br>{% endif %}{{ item }}{% endfor -%}
{%- set ns.sep = true -%}
{%- endif -%}
{%- endfor -%}
{%- if properties -%}
{%- if ns.sep %}<hr>{% endif -%}
{%- for k, v in properties.items() %}{% if not loop.first %}<br>{% endif %}{{ k }}: {{ v }}{% endfor -%}
{%- set ns.sep = true -%}
{%- endif -%}
"""

# Card templates are Anki's own mustache, not Jinja (notedef.py renders only the
# [map]). One forward card: the term prompts, the info dump answers.
[[cards]]
name = "Card 1"
qfmt = "{{Front}}"
afmt = "{{FrontSide}}\n<hr id=answer>\n{{Back}}"
