# The neutral catch-all note: the guaranteed terminus for any word no pack note
# (bespoke or the pack's own `applies_to = "*"` default) claims. It names no
# domain — Front is the bare word, Back dumps whatever WordInfo
# carries, in fixed sections (translations -> definitions -> features ->
# index-aligned example/gloss pairs) separated by <hr>, each section's items by
# <br>. The <br>/<hr>/<i> tags are our structure; every provider-supplied value
# is autoescaped (notedef.py) so it cannot inject markup into the card.
#
# A section renders only when its source list is non-empty, and the <hr>
# separator is emitted only between two present sections (the `ns.sep` flag), so
# there is never a leading, trailing, or doubled rule.
name = "Ankery Basic"

[map]
Front = "{{ word }}"
Back = """
{%- set ns = namespace(sep = false) -%}
{%- if translations -%}
{{ translations | join(', ') }}
{%- set ns.sep = true -%}
{%- endif -%}
{%- if definitions -%}
{%- if ns.sep %}<hr>{% endif -%}
{%- for d in definitions %}{% if not loop.first %}<br>{% endif %}{{ d }}{% endfor -%}
{%- set ns.sep = true -%}
{%- endif -%}
{%- if features -%}
{%- if ns.sep %}<hr>{% endif -%}
{%- for k, v in features.items() %}{% if not loop.first %}<br>{% endif %}{{ k }}: {{ v }}{% endfor -%}
{%- set ns.sep = true -%}
{%- endif -%}
{%- if examples -%}
{%- if ns.sep %}<hr>{% endif -%}
{%- for ex in examples %}{% if not loop.first %}<br>{% endif %}<i>{{ ex }}</i>{% if loop.index0 < example_translations | length and example_translations[loop.index0] %} — {{ example_translations[loop.index0] }}{% endif %}{% endfor -%}
{%- endif -%}
"""
