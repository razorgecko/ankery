name = "Ankery DE: Verb"
applies_to = "verb"

# The six present forms are separate fields; the "ich .. / du .." layout lives in
# the card templates below, not in the map. Keys read from properties (declared in
# ../pack.toml [pos.verb]).
[map]
Infinitive  = "{{ term }}"
Translation = "{{ collections.translations | join(', ') }}"
Aux         = "{{ properties.auxiliary }}"
Present1sg  = "{{ properties.present_1sg }}"
Present2sg  = "{{ properties.present_2sg }}"
Present3sg  = "{{ properties.present_3sg }}"
Present1pl  = "{{ properties.present_1pl }}"
Present2pl  = "{{ properties.present_2pl }}"
Present3pl  = "{{ properties.present_3pl }}"
Preterite   = "{{ properties.preterite }}"
Perfect     = "{{ properties.perfect }}"
Example     = "{{ collections.examples[0] }}{% if collections.example_translations %} — {{ collections.example_translations[0] }}{% endif %}"

[[cards]]
name = "V1 Recognition"
qfmt = "{{Infinitive}}"
afmt = "{{FrontSide}}<hr id=answer>{{Translation}}<br><br>Präsens<br>ich {{Present1sg}} / du {{Present2sg}} / er {{Present3sg}} / wir {{Present1pl}} / ihr {{Present2pl}} / sie {{Present3pl}}<br>Prät. {{Preterite}} &nbsp; Perf. {{Perfect}}<br><br>{{Example}}"

[[cards]]
name = "V2 Production"
qfmt = "{{Translation}} (verb)"
afmt = "{{FrontSide}}<hr id=answer>{{Infinitive}} ({{Aux}})"

[[cards]]
name = "V3 Forms recall"
qfmt = "{{Infinitive}} – {{Translation}}<br>conjugate: present (all six)"
afmt = "{{FrontSide}}<hr id=answer>ich {{Present1sg}} / du {{Present2sg}} / er {{Present3sg}} / wir {{Present1pl}} / ihr {{Present2pl}} / sie {{Present3pl}}<hr>not graded: Prät. {{Preterite}} / Perf. {{Perfect}} ({{Aux}})"
