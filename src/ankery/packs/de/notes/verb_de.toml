name = "Ankery DE: Verb"
applies_to = "verb"

# The six present forms are separate fields; the "ich .. / du .." layout lives in
# the card templates below, not in the map. Keys read from properties (declared in
# ../pack.toml [pos.verb]).
#
# Headword is Anki's first-field duplicate key: the term with its governed
# preposition, plus the perfect (ziehen, ist gezogen), so each prepositional sense
# and each sense with its own perfect is its own note. No card shows it; the
# fronts compose the term from Infinitive and Preposition.
#
# Adding a note whose Infinitive or Perfect another note in the deck already has,
# under a different Headword, prints a warning: the same verb looked up with
# other forms, or another sense of it.
warn_if_shared = ["Infinitive", "Perfect"]

[map]
Headword    = "{{ properties.headword }}"
Infinitive  = "{{ properties.base }}"
Translation = "{{ collections.translations | join(', ') }}"
Aux         = "{{ properties.auxiliary }}"
Present1sg  = "{{ properties.present_1sg }}"
Present2sg  = "{{ properties.present_2sg }}"
Present3sg  = "{{ properties.present_3sg }}"
Present1pl  = "{{ properties.present_1pl }}"
Present2pl  = "{{ properties.present_2pl }}"
Present3pl  = "{{ properties.present_3pl }}"
Preterite   = "{{ properties.preterite }}"
Perfect     = "{{ properties.perfect }}"
Example     = "{{ collections.examples[0] }}{% if collections.example_translations %} — {{ collections.example_translations[0] }}{% endif %}"
Preposition = "{{ properties.preposition }}"
Case        = "{{ properties.preposition_case }}"

[[cards]]
name = "V1 Recognition"
qfmt = "{{Infinitive}}{{#Preposition}} {{Preposition}}{{/Preposition}}{{#Perfect}}<br>{{Perfect}}{{/Perfect}}"
afmt = "{{FrontSide}}<hr id=answer>{{Translation}}{{#Preposition}}<br>{{Preposition}}{{#Case}} + {{Case}}{{/Case}}{{/Preposition}}<br><br>Präsens<br>ich {{Present1sg}} / du {{Present2sg}} / er {{Present3sg}} / wir {{Present1pl}} / ihr {{Present2pl}} / sie {{Present3pl}}<br>Prät. {{Preterite}}<br>Perf. {{Perfect}}<br><br>{{Example}}"

[[cards]]
name = "V2 Production"
qfmt = "{{Translation}} (verb)"
afmt = "{{FrontSide}}<hr id=answer>{{Infinitive}}{{#Preposition}} {{Preposition}}{{/Preposition}}{{#Case}} + {{Case}}{{/Case}} ({{Aux}})<br>ich {{Present1sg}}"

[[cards]]
name = "V3 Forms recall"
qfmt = "{{Infinitive}}{{#Preposition}} {{Preposition}}{{/Preposition}} – {{Translation}}<br>conjugate: present (all six)"
afmt = "{{FrontSide}}<hr id=answer>ich {{Present1sg}} / du {{Present2sg}} / er {{Present3sg}} / wir {{Present1pl}} / ihr {{Present2pl}} / sie {{Present3pl}}<hr>Prät. {{Preterite}}<br>Perf. {{Perfect}}"

# The whole front sits inside the Preposition section, so Anki generates this
# card only for notes with a preposition.
[[cards]]
name = "V4 Preposition"
qfmt = "{{#Preposition}}{{Translation}}<br>{{Infinitive}} ___ + ?{{/Preposition}}"
afmt = "{{FrontSide}}<hr id=answer>{{Preposition}}{{#Case}} + {{Case}}{{/Case}}{{#Example}}<br>{{Example}}{{/Example}}"
