name = "Ankery DE: Noun"
applies_to = "noun"

# Field order is the order of these keys. Headword leads because Anki keys
# duplicate detection on the first field: it holds the grammar that tells two
# senses of one term apart (See (der) / See (die)), and no card shows it. The map
# reads the property keys the pack declares for nouns (see ../pack.toml
# [pos.noun]); an undeclared/absent key renders empty.
#
# Adding a note whose Word or Plural another note in the deck already has, under
# a different Headword, prints a warning: the same noun looked up with other
# forms, or another sense of it.
warn_if_shared = ["Word", "Plural"]

[map]
Headword    = "{{ properties.headword }}"
Word        = "{{ term }}"
Article     = "{{ properties.gender }}"
Plural      = "{{ properties.nominative_pl }}"
GenitiveSg  = "{{ properties.genitive_sg }}"
Translation = "{{ collections.translations | join(', ') }}"
Example     = "{{ collections.examples[0] }}{% if collections.example_translations %} — {{ collections.example_translations[0] }}{% endif %}"

# A noun with no Article has no singular: Word holds its plural. The fronts spell
# that case "die Word (Pl.)" themselves, matching the filter's headword rule. Every
# back shows the forms line singular, plural, genitive, with "-" for a missing form.
[[cards]]
name = "N1 Recognition"
qfmt = "{{#Article}}{{Article}} <span class=\"g-{{Article}}\">{{Word}}</span>{{#Plural}}, {{Plural}}{{/Plural}}{{/Article}}{{^Article}}die {{Word}} (Pl.){{/Article}}"
afmt = "{{FrontSide}}<hr id=answer>{{Translation}}<br><br>{{#Article}}{{Article}} <span class=\"g-{{Article}}\">{{Word}}</span>{{/Article}}{{^Article}}-{{/Article}}, Pl. {{#Plural}}{{Plural}}{{/Plural}}{{^Plural}}-{{/Plural}}, Gen. {{#GenitiveSg}}{{GenitiveSg}}{{/GenitiveSg}}{{^GenitiveSg}}-{{/GenitiveSg}}<br><br>{{Example}}"

[[cards]]
name = "N2 Production"
qfmt = "{{Translation}} (noun)"
afmt = "{{FrontSide}}<hr id=answer>{{#Article}}{{Article}} <span class=\"g-{{Article}}\">{{Word}}</span>{{/Article}}{{^Article}}-{{/Article}}, Pl. {{#Plural}}{{Plural}}{{/Plural}}{{^Plural}}-{{/Plural}}, Gen. {{#GenitiveSg}}{{GenitiveSg}}{{/GenitiveSg}}{{^GenitiveSg}}-{{/GenitiveSg}}"
