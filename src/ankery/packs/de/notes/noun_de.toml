name = "Ankery DE: Noun"
applies_to = "noun"

# Field order is the order of these keys. Word leads because Anki keys duplicate
# detection on the first field; leading with Article would flag every same-gender
# noun as a duplicate. The map reads the property keys the pack declares for nouns
# (see ../pack.toml [pos.noun]); an undeclared/absent key renders empty.
[map]
Word        = "{{ term }}"
Article     = "{{ properties.gender }}"
Plural      = "{{ properties.nominative_pl }}"
GenitiveSg  = "{{ properties.genitive_sg }}"
Translation = "{{ collections.translations | join(', ') }}"
Example     = "{{ collections.examples[0] }}{% if collections.example_translations %} — {{ collections.example_translations[0] }}{% endif %}"

[[cards]]
name = "N1 Recognition"
qfmt = "{{Article}} {{Word}}"
afmt = "{{FrontSide}}<hr id=answer>{{Translation}}<br><br>Pl. {{Plural}} &nbsp; Gen. {{GenitiveSg}}<br><br>{{Example}}"

[[cards]]
name = "N2 Production"
qfmt = "{{Translation}} (noun)"
afmt = "{{FrontSide}}<hr id=answer>{{Article}} {{Word}}, Pl. {{Plural}}, Gen. {{GenitiveSg}}"
