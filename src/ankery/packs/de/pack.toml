# German language pack.
#
# Everything language-specific about German lives in this directory: this file
# (grammar vocabulary + LLM guidance + provider preferences), the optional
# filter.py (output normalization), the optional provider.py (the netzverb
# scraper), and notes/ (card layouts). The engine names no language; it loads a
# pack by code and wires itself from it.

name = "German"

# Preferred provider chain, in fallback order. Names resolve first against this
# pack's provider.py, then the engine's cross-language registry (currently just
# "llm"). Overridable per run with --provider.
providers = ["netzverb", "llm"]

# The pack's routing dimension. `name` is the table below that enumerates the
# category values (here [pos.*]) and is the closed vocabulary the LLM classifies
# into; `label` is the human phrase the LLM prompt uses for it (and the JSON key
# the model fills, mapped onto WordInfo's generic `category`). For German the
# categories are parts of speech; another pack might use `name = "kind"` with a
# [kind.*] table instead. Must follow the bare top-level keys above (a TOML table
# header captures every key after it).
[category]
name = "pos"
label = "part of speech"

# Variables this pack declares, each with the default used when none is supplied.
# This pack's prompt and its netzverb scraper read target_language to pick the
# language of translations and example glosses.
[variables.target_language]
meaning = "language to write translations and example glosses in"
default = "en"

# Options handed to this pack's providers when built. Keyed by provider name;
# the builder in provider.py reads its own table. Keeps provider tunables in the
# pack instead of leaking a German-specific knob into the engine's Config.
[provider_options.netzverb]
timeout = 15.0

# Features common to every part of speech: declared key -> what it means to the
# LLM. `ipa` is where the old `pronunciation` field went — a feature, not a
# privileged core field, so a language can declare `reading`/`pinyin` instead.
[features]
ipa = "IPA transcription of the pronunciation, e.g. /haʊs/; omit if unsure"

# Per-POS grammar. `citation` defines the lemma form, `guidance` is extra prose
# for the LLM, and each `features` table declares the keys for that POS with the
# meaning handed to the LLM and read back by the notes. The set of [pos.*]
# sections is also the closed vocabulary the LLM classifies the category into
# (declared as [category] above).

[pos.noun]
citation = "nominative singular; the bare lemma with no article"
[pos.noun.features]
gender = "the definite article der/die/das that marks grammatical gender"
nominative_pl = "nominative plural form (bare, no article)"
genitive_sg = "genitive singular form (bare, no article)"

[pos.verb]
citation = "the infinitive"
guidance = [
    "Fill all six present-tense forms even when the verb is regular; per-person stem changes cannot be recovered from a single form.",
    "preterite is the 1st/3rd person singular form.",
    "perfect is the full compound form (auxiliary + past participle).",
    "For separable/prefixed verbs, give each form as it appears in a sentence.",
]
[pos.verb.features]
present_1sg = "1st person singular present (ich)"
present_2sg = "2nd person singular present (du)"
present_3sg = "3rd person singular present (er/sie/es)"
present_1pl = "1st person plural present (wir)"
present_2pl = "2nd person plural present (ihr)"
present_3pl = "3rd person plural present (sie)"
preterite = "preterite, 1st/3rd person singular"
perfect = "perfect tense: auxiliary + past participle"
auxiliary = "perfect-tense auxiliary, haben or sein"
separable = "\"true\" if the verb has a separable prefix, else \"false\""

[pos.adjective]
citation = "the base (positive) form, uninflected (no declension ending)"
[pos.adjective.features]
comparative = "comparative form (bare)"
superlative = "superlative form, with am, e.g. am schnellsten"

# `guidance` and the feature meanings below are rendered into the LLM prompt
# (prompts.py), so they read as instructions to the model, not as notes to a
# maintainer. The rationale — German uses the bare adjective as its manner
# adverb, so a manner-adverb card would only duplicate the adjective — lives
# here in this comment, which the prompt never sees.
[pos.adverb]
citation = "the adverb in its base form"
guidance = [
    "Classify as adverb only a lexical adverb with no adjective form: temporal (heute, oft), local (hier, dort), degree (sehr, ziemlich), modal/sentence (leider, deshalb, ja).",
    "If the word is the bare adjective used adverbially (schnell, gut, langsam), classify it as an adjective, not an adverb.",
    "Fill comparative/superlative only for the few gradable adverbs (gern/lieber, bald/eher); omit them otherwise.",
]
[pos.adverb.features]
comparative = "comparative form; omit unless the adverb is gradable"
superlative = "superlative form; omit unless the adverb is gradable"

[pos.preposition]
citation = "the preposition"
[pos.preposition.features]
governs_case = "the case it governs: accusative, dative, genitive, or accusative/dative for two-way (Wechsel) prepositions"

# The four function-word classes below (pronoun, article, conjunction, particle)
# round out netzverb's scrapable POS set so routing and classification line up
# with what the provider can serve. They are deliberately feature-light: the
# netzverb scraper extracts no special grammar for them (only gloss/IPA/example),
# and their declension/inflection is either rule-governed or not card-worthy, so
# the citation + boundary guidance carry the weight. The guidance exists chiefly
# to keep the LLM from bleeding these classes into the open ones next door —
# pronoun vs article, particle vs adverb, conjunction vs conjunctional adverb —
# since all nine POS now compete in one classification set.

[pos.pronoun]
citation = "the nominative base form, e.g. ich, er, sie, mein, dieser, welcher, wer"
guidance = [
    "Classify as pronoun a word that REPLACES a noun phrase rather than standing beside a noun: personal (ich, du, er, wir), reflexive (mich, sich), demonstrative (dieser, jener), relative (welcher, was), interrogative (wer, was, welcher, wessen), or indefinite (man, jemand, niemand, etwas, nichts, alles).",
    "The words der, die, das, ein, eine, kein are articles, not pronouns — classify those as article, even though der/die/das can also act as relative or demonstrative pronouns in context.",
    "A possessive standing alone (meiner, deins) is a pronoun; the bare possessive lemma used before a noun (mein, dein, sein) is an article.",
]

[pos.article]
citation = "the masculine nominative singular base form, e.g. der, ein, kein, mein"
guidance = [
    "Classify as article only a determiner that marks a noun's definiteness or possession and stands directly before the noun: the definite der/die/das, the indefinite ein/eine, the negative kein/keine, and the possessive articles mein/dein/sein/ihr/unser/euer.",
    "Give the bare nominative lemma; do not spell out the full case/gender declension.",
    "A word that replaces the noun instead of accompanying it is a pronoun, not an article.",
]

[pos.conjunction]
citation = "the conjunction, uninflected"
guidance = [
    "A conjunction joins words, phrases, or clauses. Coordinating conjunctions (und, oder, aber, denn, sondern, sowie) join elements of equal rank and do not change word order; subordinating conjunctions (dass, weil, wenn, ob, obwohl, als, damit, während) introduce a subordinate clause and send the finite verb to the clause-final position.",
    "Conjunctional adverbs (deshalb, trotzdem, außerdem, dann, jedoch) link sentences but occupy the first sentence position and are followed by the finite verb — classify those as adverbs, not conjunctions.",
]

# Particle is the easiest class to over-apply: German calls many small words
# Partikeln colloquially, but here it means the residual uninflected words that
# are NOT adverbs, conjunctions, or prepositions. The Vorfeld test in the second
# bullet is the sharp line against adverbs and is the one the model most needs.
[pos.particle]
citation = "the particle in its base form, uninflected and without comparison"
guidance = [
    "Classify as particle an uninflected word with no standalone sentence role: modal/flavouring particles that colour the speaker's attitude (doch, mal, ja, halt, eben, schon, wohl, eigentlich) and focus particles that highlight a phrase (auch, nur, sogar, selbst, gerade).",
    "Distinguish from adverbs by the Vorfeld test: an adverb answers wie/wann/wo and can stand alone as the first element before the finite verb (Heute kommt er); a particle cannot occupy that slot on its own. If the word can, it is an adverb, not a particle.",
    "Do not classify a coordinating/subordinating linker (a conjunction) or a case-governing word (a preposition) as a particle, even though both are uninflected.",
]
