[project]
name = "ankery"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
]

[project.scripts]
ankery = "ankery.__main__:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "genanki>=0.13.1",
    "pytest>=9.0.3",
    "pytest-httpx>=0.36.2",
]
